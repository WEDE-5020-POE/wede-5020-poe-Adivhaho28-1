    <main>
        <h2>Orders</h2>

        <p>Fill in the details and place your order.</p>

        <form>

            <label>Name:</label><br>
            <input type="text" name="name" required><br><br>

            <label>Email:</label><br>
            <input type="email" name="email" required><br><br>

            <label>Select wig:</label><br>
            <select name="wig">
                <option>Body wave wig</option>
                <option> Latisha wig</option>
                <option>Straight 32inch wig</option>
            </select><br><br>

            <label>Quantity:</label><br>
            <input type="number" name="quantity" min="1"><br><br>

            <label>Delivery Address:</label><br>
            <textarea name="address" rows="7" cols="45"></textarea><br><br>

            <label>Additional Notes:</label><br>
            <textarea name="notes" rows="7" cols="45"></textarea><br><br>

            <input type="submit" value="submit"><br><br>

        </form>
    </main>
